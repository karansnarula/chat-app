include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "build/**"
    - "**/*.g.dart"
    - "**/*.config.dart"
    - "lib/firebase_options.dart"
    - "lib/l10n/generated/**"

linter:
  rules:
    # This is an application, not a published package — docs on every public
    # member would be noise.
    public_member_api_docs: false
    # pubspec dependencies are grouped by purpose with comments instead of
    # sorted alphabetically.
    sort_pub_dependencies: false
