name: chat_app
description: "Real-time chat application with friends, conversations, and push notifications."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Routing
  go_router: ^17.3.0

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking
  dio: ^5.10.0
  retrofit: ^4.9.2
  json_annotation: ^4.12.0

  # Realtime
  socket_io_client: ^3.1.6

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # Push notifications
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0

  # Streams
  async: ^2.13.1
  stream_transform: ^2.1.1

  # Misc
  connectivity_plus: ^7.3.0
  emoji_picker_flutter: ^4.4.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  retrofit_generator: ^10.2.7
  json_serializable: ^6.14.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Tooling
  very_good_analysis: ^10.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
